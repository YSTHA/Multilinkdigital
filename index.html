<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Multilink Billing System</title>

<link rel="stylesheet" href="style.css">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="container">

<h1>Multilink Billing System</h1>
<h4>Thaiba, Godavari-14</h4>
<h4>Contact: 9841452730 , 5560697</h4>

<div class="top">

<label>Customer</label>
<input id="customerInput">

<label>Invoice</label>
<input id="invoiceNumber" disabled>

<label>Date</label>
<input id="billDate" disabled>

</div>


<h3>Add Item</h3>

<div class="itemInput">

<input id="particular" list="services" placeholder="Particular">
<datalist id="services"></datalist>

<input id="qty" type="number" placeholder="Qty">

<input id="rate" type="number" placeholder="Rate">

<button onclick="addItem()">Add</button>

</div>


<table id="billTable">

<tr>
<th>S.N</th>
<th>Particular</th>
<th>Qty</th>
<th>Rate</th>
<th>Amount</th>
<th>Action</th>
</tr>

</table>


<div class="summary">

<p>
Discount Rs 
<input id="discount" value="0" type="number" oninput="renderTable()">
</p>

<p class="totalBox">
Total Rs <span id="total">0</span>
</p>

<p>
Advance Rs 
<input id="advance" value="0" type="number" oninput="renderTable()">
</p>

<p class="balanceBox">
Balance Rs <span id="balance">0</span>
</p>

</div>


<div class="buttons">

<button onclick="generateBill()">Generate Bill</button>

<button onclick="window.print()">Print</button>
<button onclick="downloadPDF()">Download PDF</button>
<button onclick="newBill()">New Bill</button>
<button onclick="shareBill()">Share</button>

</div>


<hr>


<h3>Invoice Search</h3>

<input id="searchInput" placeholder="Invoice Number">

<button onclick="searchInvoice()">Search</button>

<button onclick="viewAllInvoices()">View All</button>




<div id="invoiceList"></div>

</div>


<div id="billDisplay" class="billDisplay"></div>


<script src="script.js"></script>

</body>
</html>
